<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單明細 - 香奈兒 CHANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --primary-gradient: linear-gradient(90deg, #FF69B4 0%, #FFC0CB 100%); --glass-bg: rgba(255, 255, 255, 0.9); }
        body { background: #FFF0F5; color: #333; font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: #FFF0F5 !important; border-bottom: 1px solid rgba(0, 0, 0, 0.1); position: sticky; top: 0; z-index: 1000; }
        .brand-logo { font-weight: bold; color: #FF69B4; text-decoration: none; display: flex; align-items: center; }
        .brand-logo img { width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; }
        
        .main-content { flex: 1; padding: 2rem; }
        .page-header { text-align: center; margin-bottom: 2rem; }
        .page-header h1 { color: #FF69B4; font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        
        .order-details-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #FFE0E6;
            margin-bottom: 20px;
        }
        
        .order-info { flex: 1; }
        .order-id { font-size: 0.9rem; color: #888; margin-bottom: 5px; }
        .order-id strong { color: #FF69B4; font-size: 1.1rem; }
        .order-date { font-size: 0.9rem; color: #888; }
        
        .order-status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        
        .status-pending { background: #FFF3CD; color: #856404; }
        .status-completed { background: #D4EDDA; color: #155724; }
        .status-cancelled { background: #F8D7DA; color: #721C24; }
        
        .items-section { margin-bottom: 2rem; }
        .items-section h3 { color: #FF69B4; font-size: 1.3rem; font-weight: 600; margin-bottom: 15px; }
        
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #eee;
        }
        
        .item-image { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; margin-right: 15px; }
        .item-details { flex: 1; }
        .item-name { font-weight: 600; color: #333; margin-bottom: 5px; }
        .item-sku { font-size: 0.85rem; color: #888; }
        
        .item-price-info {
            display: flex;
            gap: 30px;
            align-items: center;
            font-size: 0.95rem;
        }
        
        .price-item { display: flex; flex-direction: column; align-items: center; }
        .price-label { color: #888; font-size: 0.8rem; margin-bottom: 3px; }
        .price-value { color: #FF69B4; font-weight: 600; font-size: 1.1rem; }
        
        .summary-section {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 2rem;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        
        .summary-row strong { color: #333; }
        .summary-row span { color: #FF69B4; }
        
        .total-row {
            display: flex;
            justify-content: space-between;
            padding-top: 15px;
            border-top: 2px solid #ddd;
            font-size: 1.2rem;
            font-weight: 700;
        }
        
        .total-row span { color: #FF69B4; }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-custom {
            border: 2px solid #FF69B4;
            border-radius: 50px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            color: #006241;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f2f6f4;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .btn-custom:hover {
            background: #00704A;
            color: white;
            border-color: #00704A;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        
        .error-message {
            background: #F8D7DA;
            color: #721C24;
            border: 1px solid #F5C6CB;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        
        /* Footer Styles */
        .footer {
            background: linear-gradient(135deg, #FFB6C1 0%, #FFC0CB 100%);
            padding: 4rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            position: relative;
            overflow: hidden;
            border-top: 3px solid #FF69B4;
            margin-top: auto;
        }
        .footer::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #FF69B4, #FFC0CB); }
        .footer-section { display: flex; flex-direction: column; gap: 1.2rem; min-width: 0; }
        .footer-section h3 { color: #333; font-size: 1.3rem; font-weight: 600; position: relative; padding-bottom: 0.8rem; margin-bottom: 0.5rem; }
        .footer-section h3::after { content: ''; position: absolute; bottom: 0; left: 0; width: 40px; height: 3px; background: linear-gradient(90deg, #FF69B4, #FFC0CB); border-radius: 2px; }
        .footer-section p, .footer-section ul li { color: #666; font-size: 0.95rem; line-height: 1.6; margin: 0; }
        .footer-section ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.8rem; }
        .footer-section ul li { display: flex; align-items: center; transition: transform 0.3s ease; white-space: nowrap; }
        .footer-section ul li a { text-decoration: none; color: inherit; width: 100%; display: inline-block; }
        .footer-section ul li:hover { transform: translateX(5px); color: #FF69B4; }
        .social-links { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 0.5rem; }
        .social-links a { text-decoration: none; color: #666; padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; transition: all 0.3s ease; background: rgba(255, 182, 193, 0.1); display: inline-flex; align-items: center; white-space: nowrap; }
        .social-links a:hover { background: linear-gradient(135deg, #FF69B4 0%, #FFC0CB 100%); color: white; transform: translateY(-2px); }
        
        @media (max-width: 768px) {
            .item-row { flex-direction: column; text-align: center; }
            .item-image { margin-right: 0; margin-bottom: 10px; }
            .item-price-info { flex-direction: column; gap: 10px; }
            .order-header { flex-direction: column; text-align: center; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand brand-logo" href="index.html">
                <i class="fa-solid fa-crown"></i> CHANEL
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="order.html">訂單查詢</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">購物車</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container">
            <div class="page-header">
                <h1><i class="fa-solid fa-receipt"></i> 訂單明細</h1>
            </div>

            <div id="error-container"></div>
            <div id="order-container"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-section">
            <h3><i class="fa-solid fa-crown"></i> CHANEL</h3>
            <p>專業奢侈品購物平台，提供最精選的商品與服務。</p>
        </div>
        <div class="footer-section">
            <h3>快速連結</h3>
            <ul>
                <li><a href="index.html">首頁</a></li>
                <li><a href="product.html">商品</a></li>
                <li><a href="cart.html">購物車</a></li>
                <li><a href="order.html">訂單查詢</a></li>
            </ul>
        </div>
        <div class="footer-section">
            <h3>聯絡方式</h3>
            <p>電話: 0800-000-000<br>信箱: support@chanel.com</p>
            <div class="social-links">
                <a href="https://facebook.com"><i class="fab fa-facebook"></i> Facebook</a>
                <a href="https://instagram.com"><i class="fab fa-instagram"></i> Instagram</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 獲取 URL 參數
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');

        // 模擬訂單資料（實際應從後端 API 獲取）
        const mockOrders = {
            'ORD001': {
                id: 'ORD001',
                date: '2024-06-01',
                status: 'completed',
                items: [
                    { id: 1, name: '香奈兒經典包包', sku: 'CHANEL-BAG-001', quantity: 1, price: 5500, image: 'image/product-1.jpg' },
                    { id: 2, name: '香奈兒香水', sku: 'CHANEL-PERF-001', quantity: 2, price: 1200, image: 'image/product-2.jpg' }
                ]
            },
            'ORD002': {
                id: 'ORD002',
                date: '2024-06-02',
                status: 'pending',
                items: [
                    { id: 3, name: '香奈兒手錶', sku: 'CHANEL-WATCH-001', quantity: 1, price: 8800, image: 'image/product-3.jpg' }
                ]
            }
        };

        function renderOrderDetails() {
            const errorContainer = document.getElementById('error-container');
            const orderContainer = document.getElementById('order-container');

            if (!orderId || !mockOrders[orderId]) {
                errorContainer.innerHTML = `
                    <div class="error-message">
                        <i class="fa-solid fa-circle-exclamation"></i> 訂單不存在或查詢代碼有誤
                    </div>
                `;
                orderContainer.innerHTML = `
                    <div class="button-group">
                        <a href="index.html" class="btn-custom"><i class="fa-solid fa-house"></i> 回首頁</a>
                        <a href="order.html" class="btn-custom"><i class="fa-solid fa-list"></i> 回訂單列表</a>
                    </div>
                `;
                return;
            }

            const order = mockOrders[orderId];
            const statusText = {
                'completed': '已完成',
                'pending': '處理中',
                'cancelled': '已取消'
            };
            const statusClass = `status-${order.status}`;
            const statusLabel = statusText[order.status] || '未知';

            let itemsHTML = '';
            let subtotal = 0;

            order.items.forEach(item => {
                const total = item.quantity * item.price;
                subtotal += total;
                itemsHTML += `
                    <div class="item-row">
                        <img src="${item.image}" alt="${item.name}" class="item-image" onerror="this.src='https://via.placeholder.com/80?text=No+Image'">
                        <div class="item-details">
                            <div class="item-name">${item.name}</div>
                            <div class="item-sku">SKU: ${item.sku}</div>
                        </div>
                        <div class="item-price-info">
                            <div class="price-item">
                                <div class="price-label">單價</div>
                                <div class="price-value">NT$ ${item.price.toLocaleString()}</div>
                            </div>
                            <div class="price-item">
                                <div class="price-label">數量</div>
                                <div class="price-value">${item.quantity}</div>
                            </div>
                            <div class="price-item">
                                <div class="price-label">小計</div>
                                <div class="price-value">NT$ ${total.toLocaleString()}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            const shippingFee = 100;
            const tax = Math.floor(subtotal * 0.05);
            const total = subtotal + shippingFee + tax;

            const html = `
                <div class="order-details-card">
                    <div class="order-header">
                        <div class="order-info">
                            <div class="order-id">訂單編號: <strong>${order.id}</strong></div>
                            <div class="order-date">下單日期: ${new Date(order.date).toLocaleDateString('zh-TW')}</div>
                        </div>
                        <span class="order-status ${statusClass}">${statusLabel}</span>
                    </div>

                    <div class="items-section">
                        <h3><i class="fa-solid fa-box"></i> 商品清單</h3>
                        ${itemsHTML}
                    </div>

                    <div class="summary-section">
                        <div class="summary-row">
                            <strong>小計</strong>
                            <span>NT$ ${subtotal.toLocaleString()}</span>
                        </div>
                        <div class="summary-row">
                            <strong>稅金 (5%)</strong>
                            <span>NT$ ${tax.toLocaleString()}</span>
                        </div>
                        <div class="summary-row">
                            <strong>運費</strong>
                            <span>NT$ ${shippingFee.toLocaleString()}</span>
                        </div>
                        <div class="total-row">
                            <strong>總計</strong>
                            <span>NT$ ${total.toLocaleString()}</span>
                        </div>
                    </div>

                    <div class="button-group">
                        <a href="index.html" class="btn-custom"><i class="fa-solid fa-house"></i> 回首頁</a>
                        <a href="order.html" class="btn-custom"><i class="fa-solid fa-list"></i> 回訂單列表</a>
                    </div>
                </div>
            `;

            orderContainer.innerHTML = html;
        }

        renderOrderDetails();
    </script>
</body>
</html>
